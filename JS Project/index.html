<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <h1 style="color: #C7DDF5">EMPLOYEE MANAGEMENT SYSTEM</h1>

        <div style="color: #C7DDF5" class="datetime">
          <p id="date"></p>
          <p id="time"></p>
        </div>
      </header>

      <!-- Search -->
      <section class="search-section">
        <input type="text" id="searchInput" placeholder="Search Employee..." />

        <button id="searchBtn">Search</button>
      </section>

      <!-- Department Filter -->
      <section class="filters">
        <button class="department-btn active" data-department="All">
          All Employees
        </button>

        <button class="department-btn" data-department="IT">IT</button>

        <button class="department-btn" data-department="HR">HR</button>

        <button class="department-btn" data-department="Finance">
          Finance
        </button>

        <button class="department-btn" data-department="Marketing">
          Marketing
        </button>
      </section>

      <!-- Status -->
      <p id="status" class="status">Loading employees...</p>

      <!-- Employee Statistics -->
      <section class="statistics">
        <div class="stat-card">
          <h3>Total Employees</h3>
          <p id="employeeCount">0</p>
        </div>

        <div class="stat-card">
          <h3>Total Salary</h3>
          <p id="totalSalary">₹0</p>
        </div>

        <div class="stat-card">
          <h3>Average Salary</h3>
          <p id="averageSalary">₹0</p>
        </div>
      </section>

      <!-- Highest Salary -->
      <section class="highest-salary">
        <h2>Highest Paid Employee</h2>

        <p id="highestEmployee">No employee available</p>
      </section>

      <!-- Sorting -->
      <section class="sorting">
        <label for="sortSelect"> Sort Employees: </label>

        <select id="sortSelect">
          <option value="default">Default</option>

          <option value="nameAsc">Name ↑</option>

          <option value="nameDesc">Name ↓</option>

          <option value="ageAsc">Age ↑</option>

          <option value="ageDesc">Age ↓</option>

          <option value="salaryAsc">Salary ↑</option>

          <option value="salaryDesc">Salary ↓</option>
        </select>
      </section>

      <!-- Employee Cards -->
      <section>
        <div id="employeeContainer" class="employee-container">
          <!-- Employee cards will come here -->
        </div>
      </section>

      <section class="add-section">
        <h2>ADD EMPLOYEE</h2>

        <form id="employeeForm">
          <div class="form-group">
            <label>Name <span class="required">*</span></label>

            <input
              type="text"
              id="name"
              placeholder="Enter employee name"
              required
            />

            <small id="nameError"></small>
          </div>

          <div class="form-group">
            <label>Age <span class="required">*</span></label>

            <input type="number" id="age" placeholder="Enter age" required />

            <small id="ageError"></small>
          </div>

          <div class="form-group">
            <label>Email <span class="required">*</span></label>

            <input type="email" id="email" placeholder="Enter email" required />

            <small id="emailError"></small>
          </div>

          <div class="form-group">
            <label>Department <span class="required">*</span></label>

            <select id="department" required>
              <option value="">Select Department</option>

              <option value="IT">IT</option>

              <option value="HR">HR</option>

              <option value="Finance">Finance</option>

              <option value="Marketing">Marketing</option>
            </select>

            <small id="departmentError"></small>
          </div>

          <div class="form-group">
            <label>Salary <span class="required">*</span></label>

            <input
              type="number"
              id="salary"
              placeholder="Enter salary"
              required
            />

            <small id="salaryError"></small>
          </div>

          <button type="submit" class="add-btn">Add Employee</button>
        </form>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
